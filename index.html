<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Geography Passport</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a passport — navy cover band, then pages of games; stamps record what's been mastered. */
:root{
  --paper:#EEF2F4; --card:#FFFFFF; --ink:#142B3D; --muted:#566B7B; --line:#CBD6DE;
  --cover:#16324A; --cover-ink:#E9D9A6; --gold:#B8892A;
  --sea:#1F6F8B; --sea-soft:#D3E6EE; --land:#CBD5B9; --land-hover:#B5C59A; --land-ink:#6B7C57; --ctx:#E2E5DD;
  --stamp:#A8324A; --good:#2E7D4F; --good-soft:#BFE3CC; --bad:#B83A2E; --bad-soft:#F3C9C3;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1A23; --card:#162733; --ink:#E5EDF2; --muted:#93A8B6; --line:#2B4050;
  --cover:#0A1620; --cover-ink:#E2C877; --gold:#D9AE4E;
  --sea:#62B6D2; --sea-soft:#17394A; --land:#4B5A41; --land-hover:#617552; --land-ink:#A7B98F; --ctx:#22313A;
  --stamp:#E06F84; --good:#5CC58C; --good-soft:#1E4A33; --bad:#F07B6E; --bad-soft:#56241F; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1A23; --card:#162733; --ink:#E5EDF2; --muted:#93A8B6; --line:#2B4050;
  --cover:#0A1620; --cover-ink:#E2C877; --gold:#D9AE4E;
  --sea:#62B6D2; --sea-soft:#17394A; --land:#4B5A41; --land-hover:#617552; --land-ink:#A7B98F; --ctx:#22313A;
  --stamp:#E06F84; --good:#5CC58C; --good-soft:#1E4A33; --bad:#F07B6E; --bad-soft:#56241F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--body)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cover{background:var(--cover);color:var(--cover-ink)}
.cover .wrap{padding-block:28px 24px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.cover h1{font:800 clamp(30px,6vw,48px)/1 var(--display);letter-spacing:.02em;margin:0;text-transform:uppercase;text-wrap:balance}
.cover p{margin:6px 0 0;font-size:15px;opacity:.85}
.cover .crest{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;border:1.5px solid var(--cover-ink);border-radius:999px;padding:6px 12px;opacity:.9}
main{padding-block:24px 48px;display:grid;gap:24px}
h2{font:700 24px/1.2 var(--display);margin:0;text-wrap:balance}
h3{font:700 18px/1.25 var(--display);margin:0}
.eyebrow{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
.btn{appearance:none;border:1.5px solid var(--ink);background:var(--card);border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;transition:transform .12s,background .12s}
.btn:hover{background:var(--sea-soft)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--sea);border-color:var(--sea);color:var(--card)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:6px 12px;font-size:14px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* stamps */
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.stamp{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;text-align:center;padding:10px;border:2px dashed var(--line);color:var(--muted);font:700 11px/1.15 var(--display);text-transform:uppercase;letter-spacing:.05em}
.stamp b{display:block;font:500 13px var(--mono);margin-top:4px}
.stamp.tried{border-style:solid;border-color:var(--muted)}
.stamp.earned{border:3px double var(--stamp);color:var(--stamp);transform:rotate(-8deg);background:color-mix(in srgb,var(--stamp) 7%,transparent)}
.stamp.earned:nth-child(even){transform:rotate(6deg)}

/* home */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px;align-content:start}
.mode p{margin:0}
details.facts{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
details.facts summary{cursor:pointer;font:700 18px var(--display)}
.factgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:14px}
.factgrid h4{margin:0 0 4px;font:700 15px var(--display);color:var(--sea)}
.factgrid ul{margin:0;padding-left:18px}
.factgrid li{margin:2px 0}

/* game panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:16px}
.topbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.progress{height:8px;background:var(--sea-soft);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--sea);transition:width .3s}
.score{font:500 14px var(--mono)}
.q{font:700 clamp(20px,3.4vw,26px)/1.25 var(--display);margin:0;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;cursor:pointer;font-weight:700}
.opt:hover:not([disabled]){border-color:var(--sea)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.feedback{border-left:4px solid var(--sea);padding:8px 12px;background:var(--paper);border-radius:0 8px 8px 0}
.feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
.result{text-align:center;display:grid;gap:12px;justify-items:center;padding:12px 0}
.big{font:800 64px/1 var(--display);color:var(--sea)}

/* maps */
.mapbox{overflow-x:auto}
svg.map{width:100%;max-width:760px;height:auto;display:block;margin:0 auto;border-radius:14px}
svg .sea{fill:var(--sea-soft)}
svg .globe-edge{stroke:var(--land-ink);stroke-width:1}
svg .ctx{fill:var(--ctx)}
svg .region path{fill:var(--land);stroke:var(--land-ink);stroke-width:.8;stroke-linejoin:round;transition:fill .15s}
svg .faded path{fill:var(--land)}
svg .hit{cursor:pointer;outline:none}
svg .hit:hover path, svg .hit:focus-visible path{fill:var(--land-hover)}
svg .found path{fill:var(--good-soft);stroke:var(--good)}
svg .flash path{fill:var(--bad-soft);stroke:var(--bad)}
svg .reveal path{fill:var(--cover-ink);stroke:var(--gold);stroke-width:2}
svg .zone circle{fill:color-mix(in srgb,var(--card) 70%,transparent);stroke:var(--sea);stroke-width:2;stroke-dasharray:4 3}
svg .zone.hit:hover circle,svg .zone.hit:focus-visible circle{fill:var(--card);stroke-dasharray:none}
svg .zone.found circle{fill:var(--good-soft);stroke:var(--good);stroke-dasharray:none}
svg .zone.flash circle{fill:var(--bad-soft);stroke:var(--bad)}
svg .zone.reveal circle{fill:var(--cover-ink);stroke:var(--gold);stroke-dasharray:none}
svg .badge rect{fill:var(--card);stroke:var(--ink);stroke-width:1.2}
svg .badge text,svg .zone text{fill:var(--ink);font-family:var(--body);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
svg .badge{pointer-events:none}
svg .lbl{fill:var(--ink);font-family:var(--body);font-weight:700;text-anchor:middle;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
svg .lake path{fill:var(--sea);stroke:var(--sea);stroke-width:.6}
svg .river polyline{fill:none;stroke:var(--sea);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
svg .mtn polygon{fill:var(--land-ink);stroke:var(--ink);stroke-width:1;stroke-linejoin:round}
svg .inlet{fill:color-mix(in srgb,var(--sea) 18%,transparent);stroke:var(--sea);stroke-width:2;stroke-dasharray:5 4}
svg .hitline{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke}
svg .hitdot{fill:transparent}
svg .feat.hit:hover .lake path,svg .feat.hit:hover .river polyline,svg .feat.hit:hover .mtn polygon,svg .feat.hit:focus-visible .mtn polygon{fill-opacity:.75;stroke-width:5}
svg .feat.hit:hover .inlet{fill:color-mix(in srgb,var(--sea) 40%,transparent)}
svg .feat.found .lake path{fill:var(--good);stroke:var(--good)}
svg .feat.found .river polyline{stroke:var(--good)}
svg .feat.found .mtn polygon{fill:var(--good)}
svg .feat.found .inlet{stroke:var(--good);fill:color-mix(in srgb,var(--good) 25%,transparent);stroke-dasharray:none}
svg .feat.flash .lake path{fill:var(--bad);stroke:var(--bad)}
svg .feat.flash .river polyline{stroke:var(--bad)}
svg .feat.flash .mtn polygon{fill:var(--bad)}
svg .feat.flash .inlet{stroke:var(--bad);fill:color-mix(in srgb,var(--bad) 25%,transparent)}
svg .feat.reveal .hitdot,svg .feat.reveal .inlet{fill:color-mix(in srgb,var(--gold) 40%,transparent);stroke:var(--gold);stroke-width:3}
svg .feat.reveal .hitline{stroke:color-mix(in srgb,var(--gold) 55%,transparent)}
svg .bi path{stroke:var(--ink);stroke-width:.6;stroke-linejoin:round}
svg .bi .on{fill:var(--land-ink)} svg .bi .off{fill:var(--card)}
svg .capdot{fill:var(--stamp);stroke:var(--card);stroke-width:1.5}
svg .gl path{fill:var(--land);stroke:none}
svg .gl-local path,svg .gl-national path{stroke:var(--land-ink);stroke-width:.6;stroke-linejoin:round}
svg .globe-rim{fill:none;stroke:var(--ink);stroke-width:1.5}
.target{font:800 clamp(22px,4vw,30px)/1.1 var(--display);color:var(--sea)}

/* hard mode */
.hardbar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.switch{display:flex;align-items:center;gap:12px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{flex:none;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + .track{background:var(--stamp)}
.switch input:checked + .track::after{transform:translateX(20px)}
.switch input:focus-visible + .track{outline:3px solid var(--gold);outline-offset:2px}
.hardchip{display:inline-block;vertical-align:middle;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--stamp);border:1.5px solid var(--stamp);border-radius:99px;padding:2px 8px;margin-left:6px}
form.typed{display:flex;gap:8px;flex-wrap:wrap}
form.typed .inp{flex:1 1 220px;font-size:18px;padding:10px 12px}
.typed-done{border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-size:17px}
.typed-done.right{background:var(--good-soft);border-color:var(--good)}
.typed-done.wrong{background:var(--bad-soft);border-color:var(--bad)}

/* sort */
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.bucket{border:2px dashed var(--line);border-radius:14px;padding:12px;min-height:110px;background:var(--paper);cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left}
.bucket h3{font-size:16px}
.bucket.armed{border-color:var(--sea);border-style:solid}
.bucket.over{background:var(--sea-soft)}
.bucket .placed{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--ink);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;cursor:grab;font-size:15px}
.chip.sel{background:var(--sea);color:var(--card);border-color:var(--sea)}
.chip.done{cursor:default;border-color:var(--good);background:var(--good-soft);font-size:13px;padding:4px 10px}
.chip.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}

/* test */
.tsec{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:12px}
.tsec:first-of-type{border-top:0;padding-top:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;align-items:start}
.two > *{min-width:0}
.fld{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.fld label{font-weight:700;min-width:28px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px}
.inp:focus{border-color:var(--sea);outline:none}
.inp.ok{border-color:var(--good);background:var(--good-soft)}
.inp.bad{border-color:var(--bad);background:var(--bad-soft)}
.fix{grid-column:2;font-size:13px;font-weight:700;color:var(--bad)}
.fix.okn{color:var(--good)}
table.t{border-collapse:collapse;width:100%}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{font:700 14px var(--display);background:var(--paper)}
.typerow{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px}
.typerow .ex{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.model{font-size:14px;background:var(--paper);border-radius:8px;padding:8px 10px}
.globes{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.globe{border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--land) 0 30%,var(--sea) 31%);display:grid;place-items:center;font-weight:700;color:var(--card)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.checks label{display:flex;gap:4px;align-items:center}
.minimaps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px}
.minimaps figure{margin:0;text-align:center;font-weight:700;font-size:14px}
.sticky{position:sticky;bottom:0;background:var(--card);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.lesson-diagram{max-width:760px;width:100%;margin-inline:auto}.lesson-diagram .globes{justify-content:center;padding:12px 0}.lesson-diagram svg{max-height:460px}.lesson-diagram figcaption{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}.lesson-diagram figure{margin:0}.lesson-diagram .globe-svg{max-width:100%}
</style>

<header class="cover">
  <div class="wrap">
    <div>
      <h1>Geography Passport</h1>
      <p>Year 8 revision · What is Geography? · Where we live</p>
    </div>
    <span class="crest">End of topic test</span>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('gp:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem('gp:'+k,JSON.stringify(v))}catch(e){}}};
let BEST=store.get('best',{});
function saveBest(key,pct){if(!(BEST[key]>=pct)){BEST[key]=pct;store.set('best',BEST)}}
let HARD=!!store.get('hard',false);
const HC=()=>HARD?' <span class="hardchip">Hard mode</span>':'';
function typedForm(form,ph='Type your answer'){return `<form class="typed" data-form="${form}" autocomplete="off"><input class="inp" id="ans" autocomplete="off" spellcheck="false" placeholder="${ph}" aria-label="Your answer"><button class="btn primary" type="submit">Check</button></form>`}
function closeName(r,fallback){return r.close&&/[A-Z]/.test(r.close)?r.close:fallback}
const app=$('#app');

const STOP=new Set(['the','river','county','co','ocean','lough','loch','mountains','mountain','mts','mt','hills','hill','city','of','line','geography','sea']);
function norm(s,stop=true){return String(s).toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w&&!(stop&&STOP.has(w))).join('')}
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>3)return 9;let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function match(raw,accepted,stop=true){const n=norm(raw,stop);if(!n)return{ok:false,empty:true};
  for(const a of accepted)if(n===norm(a,stop))return{ok:true};
  if(knownAnswerSet.has(n)||/\d/.test(n))return{ok:false};
  const n2=norm(raw,false);for(const a of accepted)for(const [x,y] of [[n,norm(a,stop)],[n2,norm(a,false)]]){const tol=y.length>=7?2:y.length>=5?1:(y.length===4&&x.length!==4)?1:0;if(tol&&lev(x,y)<=tol)return{ok:true,close:a}}
  return{ok:false}}

/* ---------- SVG builders ---------- */
const badge=(x,y,n,r=11)=>`<g class="badge"><rect x="${x-r}" y="${y-r}" width="${2*r}" height="${2*r}" rx="4"/><text x="${x}" y="${y}" style="font-size:${r*1.15}px">${n}</text></g>`;
const lbl=(x,y,t,fs=13)=>`<text class="lbl" x="${x}" y="${y}" style="font-size:${fs}px">${esc(t)}</text>`;
function cls(id,st){let c='';if(st){if(st.clickable)c+=' hit';if(st.found&&st.found.has(id))c+=' found';if(st.flash===id||(st.missed&&st.missed.has(id)))c+=' flash';if(st.reveal===id)c+=' reveal'}return c}
const tab=(st,label)=>st&&st.clickable?` tabindex="0" role="button" aria-label="${label}"`:'';
function worldSVG(kind,st){ // kind: 'continents' | 'oceans'
  const w=MD.world;
  let s=`<svg class="map" viewBox="0 0 ${w.w} ${w.h}" role="img" aria-label="World map with numbered ${kind}"><path class="sea globe-edge" d="${w.sphere}"/>`;
  for(const c of CONTINENTS){const on=kind==='continents';
    s+=`<g class="region${on?cls(c.id,st):''}" data-id="${c.id}"${on?tab(st,'Continent '+c.n):''}><path d="${w.cont[c.id]}"/></g>`}
  if(kind==='continents'){for(const c of CONTINENTS){const [x,y]=w.clabel[c.id];s+=badge(x,y,c.n);if(st&&st.found&&st.found.has(c.id))s+=lbl(x,y+(c.id==='an'?-16:27),c.name,14)}}
  else{for(const o of OCEANS)for(const [x,y] of w.ocean[o.id]){
      s+=`<g class="zone${cls(o.id,st)}" data-id="${o.id}"${tab(st,'Ocean '+o.n)}><circle cx="${x}" cy="${y}" r="20"/><text x="${x}" y="${y}" style="font-size:14px">${o.n}</text></g>`;
      if(st&&st.found&&st.found.has(o.id)){const right=x>700,left=x<120;s+=lbl(left?x+4:right?x-12:x,y+(y<50?36:-27),o.name,14)}}}
  return s+'</svg>'}
function niSVG(kind,st){ // kind: 'counties' | 'plain'
  const m=MD.ni,on=kind==='counties';
  let s=`<svg class="map" viewBox="0 0 ${m.w} ${m.h}" role="img" aria-label="Map of Northern Ireland"><rect class="sea" width="${m.w}" height="${m.h}" rx="14"/><path class="ctx" d="${m.context}"/>`;
  for(const c of COUNTIES)s+=`<g class="region${on?cls(c.id,st):''}" data-id="${c.id}"${on?tab(st,'County '+c.n):''}><path d="${m.county[c.id]}"/></g>`;
  s+=`<g class="lake"><path d="${m.lake.neagh}"/></g>`;
  for(const c of COUNTIES){const [x,y]=m.clabel[c.id];s+=badge(x,y,c.n,12);if(st&&st.found&&st.found.has(c.id))s+=lbl(x,y+30,c.name,16)}
  return s+'</svg>'}
function miniBI(setName,dots){const inc=SETS[setName]||[],b=MD.bi;
  return `<svg class="map" viewBox="0 0 ${b.w} ${b.h}" role="img" aria-label="Map of the British Isles"><rect class="sea" width="${b.w}" height="${b.h}" rx="10"/><g class="bi">${Object.entries(b.c).map(([c,d])=>`<path class="${inc.includes(c)?'on':'off'}" d="${d}"/>`).join('')}</g>${dots?Object.values(b.cap).map(([x,y])=>`<circle class="capdot" cx="${x}" cy="${y}" r="4"/>`).join(''):''}</svg>`}

function globeSVG(k,size){return `<svg class="globe-svg" width="${size}" height="${size}" viewBox="0 0 120 120" role="img" aria-label="Globe"><defs><clipPath id="gc-${k}"><circle cx="60" cy="60" r="58"/></clipPath></defs><circle class="sea" cx="60" cy="60" r="58"/><g class="gl gl-${k}" clip-path="url(#gc-${k})"><path d="${MD.globes[k]}"/></g><circle class="globe-rim" cx="60" cy="60" r="58"/></svg>`}

function markField(id,ok,correct,close){
  const el=$('#'+id);el.classList.add(ok?'ok':'bad');
  const holder=el.closest('.fld')||el.parentElement;
  if(!ok||close){const s=document.createElement('div');s.className='fix'+(ok?' okn':'');s.textContent=ok?'Spelling: '+close:'Answer: '+correct;
    if(holder.classList.contains('fld'))holder.appendChild(s);else el.insertAdjacentElement('afterend',s)}
}
function markGroup(ids,pool,showAll){ // pool: [{name, accept}], any order, no repeats
  let sc=0;const used=new Set();
  ids.forEach(id=>{const v=$('#'+id).value;let hit=null,close=null;
    for(const p of pool){if(used.has(p.name))continue;const r=match(v,p.accept);if(r.ok){hit=p;close=r.close?p.name:null;break}}
    if(hit){used.add(hit.name);sc++;markField(id,true,'',close)}
    else markField(id,false,showAll||pool.filter(p=>!used.has(p.name)).map(p=>p.name).slice(0,3).join(' / '))});
  return sc}
function testMark(){

  one('howmany',['3','three'],'3');
  // types

  [1,2,3].forEach(k=>{const r=TYPES.find(([n,acc])=>!usedT.has(n)&&match($('#t'+k+'n').value,acc).ok);
    if(r){usedT.add(r[0]);sc++;markField('t'+k+'n',true)}else markField('t'+k+'n',false,TYPES.filter(t=>!usedT.has(t[0])).map(t=>t[0]).join(' / '));
    const list=r?EX[r[0].toLowerCase()]:[];const usedE=new Set();
    ['e1','e2'].forEach(e=>{const id='t'+k+e,v=$('#'+id).value;const res=match(v,list,false);const key=norm(v,false);
      if(res.ok&&!usedE.has(key)){usedE.add(key);sc++;markField(id,true,'',res.close)}
      else markField(id,false,r?'e.g. '+list.slice(0,3).join(', '):'name the type first')});
    $('#t'+k+'m').innerHTML=`<div class="model"><b>Model answer${r?' ('+r[0]+')':''}:</b> ${r?esc(r[2]):TYPES.map(t=>'<b>'+t[0]+'</b>: '+esc(t[2])).join('<br>')}</div>`});
  CAPITALS.forEach(([c,k],i)=>one('cap'+i,[k],k));

  const TITLES={A:'British Isles',B:'United Kingdom',C:'Great Britain'};

    const want=SETS[t],countries=countryRecall($('#map'+L+'countries').value,want);markField('map'+L+'countries',countries.ok,want.join(', '),countries.close?want.join(', '):null);if(countries.ok)sc++;
    $('#map'+L+'m').innerHTML=`<div class="fix ${r.ok&&countries.ok?'okn':''}">${r.ok?'Title ✓':'Title: '+t} · ${countries.ok?'Countries ✓':'Countries: '+want.join(', ')}</div>`}
  COUNTIES.forEach(c=>one('co'+c.n,c.accept,c.name));

  sc+=markGroup(['mo1','mo2','mo3'],[{name:'Sperrin Mountains',accept:['sperrin','sperrins','sperrin mountains']},{name:'Antrim Hills',accept:['antrim','antrim hills']},{name:'Mourne Mountains',accept:['mourne','mournes','mourne mountains']}]);
  one('riv',['bann','lower bann','upper bann'],'River Bann');
  CONTINENTS.forEach(c=>one('ct'+c.n,c.accept,c.name));

  $('#longdirm').innerHTML=`<div class="fix ${longOk?'okn':''}">${longOk?'✓ Vertical':'Answer: vertical'}</div>`;

function recallCheck(reveal){
  const ids=['rl1','rl2','rm1','rm2','rm3','rr'];
  ids.forEach(id=>{const el=$('#'+id);el.classList.remove('ok','bad');const p=el.closest('.fld');p&&p.querySelectorAll('.fix').forEach(x=>x.remove())});
  let sc=markGroup(['rl1','rl2'],LOUGHS)+markGroup(['rm1','rm2','rm3'],MOUNTAINS);
  const r=match($('#rr').value,['bann','lower bann','upper bann']);markField('rr',r.ok,'River Bann',r.close?'River Bann':null);if(r.ok)sc++;
  if(!reveal)ids.forEach(id=>{const el=$('#'+id);if(el.classList.contains('bad')){const p=el.closest('.fld');p&&p.querySelectorAll('.fix').forEach(x=>x.remove())}});
  R.tries++;if(R.first==null&&!reveal){R.first=sc;saveBest('recall',Math.round(sc/6*100))}
  const msg=$('#recallmsg');msg.className='feedback '+(sc===6?'good':'bad');
  msg.innerHTML=sc===6?`<b>6 out of 6!</b> ${R.first===6?'Stamp earned.':'Now try it again from a blank page to earn the stamp.'} <button class="btn small" data-go="recall">Start again</button>`
    :reveal?`The answers are shown in red. <button class="btn small" data-go="recall">Start again</button>`
    :`<b>${sc} out of 6.</b> Fix the red boxes and press Check again, or press Show answers.`;
}

function scaleDiagram(){
  return `<div class="globes">${['local','national','continental','global'].map((k,n)=>`<div style="text-align:center">${globeSVG(k,56+n*18)}<div class="score">${n+1}</div></div>`).join('')}</div>`;
}

function coordinateDiagram(kind='both',labels=false){
  const wanted=kind==='lat'?'latitude':kind==='long'||kind==='lon'?'longitude':kind;
  const types=wanted==='latitude'||wanted==='longitude'?[wanted]:['latitude','longitude'];
  coordinateDiagram.serial=(coordinateDiagram.serial||0)+1;
  const serial=coordinateDiagram.serial;
  return `<div class="globes" style="align-items:start;flex-wrap:wrap;gap:28px">${types.map((type,index)=>{
    const latitude=type==='latitude',clip=`coordinate-${serial}-${index}`;
    const alt=labels?(latitude?'Latitude globe with the Equator highlighted.':'Longitude globe with the Prime Meridian highlighted.'):(latitude?'Globe with horizontal lines.':'Globe with vertical lines.');
    let lines='';
    if(latitude){
      for(const y of [20,34,47,60,73,86,100]){
        const half=Math.sqrt(58*58-(y-60)*(y-60));
        lines+=`<line x1="${60-half}" y1="${y}" x2="${60+half}" y2="${y}"/>`;
      }
    }else{
      lines='<ellipse cx="60" cy="60" rx="19" ry="58"/><ellipse cx="60" cy="60" rx="39" ry="58"/><line x1="60" y1="2" x2="60" y2="118"/>';
    }
    const highlighted=labels?(latitude?'<line x1="2" y1="60" x2="118" y2="60"/>':'<line x1="60" y1="2" x2="60" y2="118"/>'):'';
    return `<figure style="margin:0;text-align:center;max-width:200px">
      <svg class="globe-svg" width="160" height="160" viewBox="0 0 120 120" role="img" aria-label="${alt}">
        <defs><clipPath id="${clip}"><circle cx="60" cy="60" r="58"/></clipPath></defs>
        <circle class="sea" cx="60" cy="60" r="58"/>
        <g class="gl gl-global" clip-path="url(#${clip})"><path d="${MD.globes.global}"/></g>
        <g fill="none" stroke="var(--ink)" stroke-width="1.1" opacity=".8" clip-path="url(#${clip})">${lines}</g>
        <g fill="none" stroke="var(--gold)" stroke-width="2.5" clip-path="url(#${clip})">${highlighted}</g>
        <circle class="globe-rim" cx="60" cy="60" r="58"/>
      </svg>
      ${labels?`<figcaption><b>${latitude?'Latitude':'Longitude'}</b><br><span class="score">${latitude?'Equator':'Prime Meridian'}</span></figcaption>`:''}
    </figure>`;
  }).join('')}</div>`;
}

/* Focused revision uses the passport's existing cards, quiz engine and stamps. */
function lessonVisual(kind,teaching=false){
  if(kind==='scales')return scaleDiagram();
  if(['mountains','rivers','loughs'].includes(kind))return physicalStudyDiagram(kind);
  if(['coordinates','latitude','longitude'].includes(kind))return coordinateDiagram(kind==='coordinates'?'both':kind,teaching);
  return '';
}
function lessonRender(key){const d=LESSONS[key];if(!d)return home();
  app.innerHTML=`<section class="panel">${backBar(d.title+HC())}

}

// Small spelling slips remain acceptable; a different known answer is not a typo.
const knownAnswerSet=new Set([
  ...CONTINENTS.flatMap(x=>[x.name,...x.accept]),...OCEANS.flatMap(x=>[x.name,...x.accept]),...COUNTIES.flatMap(x=>[x.name,...x.accept]),
  ...CAPITALS.flat(),...Object.keys(SETS),...Object.values(SETS).flat(),
  ...Object.values(LESSONS).flatMap(d=>d.questions.flatMap(q=>[q.a,...q.options,...q.accept]))
].map(x=>norm(x)));

const countryAliases={England:['England'],Scotland:['Scotland'],Wales:['Wales'],'Northern Ireland':['Northern Ireland','N Ireland','NI'],'Republic of Ireland':['Republic of Ireland','Ireland','ROI']};
function countryRecall(raw,want){
  const values=String(raw).split(/[,;\n]+|\s+(?:and|&)\s+/i).map(x=>x.trim().replace(/^(?:[0-9]+[.)-]\s*|[-•]\s*)/,'')).filter(Boolean);
  if(values.length!==want.length)return{ok:false};
  const used=new Set();let close=false;
  for(const country of want){let found=-1;for(let i=0;i<values.length;i++){if(used.has(i))continue;const r=match(values[i],countryAliases[country],false);if(r.ok){found=i;close=close||!!r.close;break}}if(found<0)return{ok:false};used.add(found)}
  return{ok:true,close};
}
